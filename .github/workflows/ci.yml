name: CI

# 质量护栏（分层渐进）：
#   硬护栏（阻断）—— 前端类型检查+构建 / 后端 ruff 格式 / 后端 pytest（PostgreSQL）/ Docker 镜像可构建
#   软护栏（仅报告，continue-on-error）—— eslint + ruff lint，存量问题逐步清理
#
# 要让硬护栏真正挡住合并，需在 GitHub → Settings → Branches 为 main 添加
# 分支保护规则，把 frontend / backend / backend-tests / docker 四个 check 设为 Required。

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 同一 PR/分支推新提交时，取消仍在跑的旧运行，节省 CI 额度
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────── 硬护栏 1：前端类型检查 + 构建 ─────────
  frontend:
    name: 前端 · 类型检查 + 构建（硬护栏）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: 账号权限模块测试与逐文件 90% 覆盖率
        run: npm run test:coverage
      - name: 门户路由回归
        run: node scripts/test-portal-routing.mjs
      - name: 生产产物防误发回归
        run: npm run test:production-build
      - name: 生产构建（固定源码及真实 API）
        env:
          SOURCE_REVISION: ${{ github.sha }}
          VITE_USE_API: 'false' # 生产入口必须覆盖继承的演示开关
        run: npm run build:production
      - name: 最终生产包匿名登录表单检查
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: npm run test:production-login

  # ───────── 硬护栏 2：后端格式检查 ─────────
  backend:
    name: 后端 · ruff 格式检查（硬护栏）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.7.0
      - name: 格式检查（与 pyproject.toml 配置一致）
        run: ruff format --check backend/app

  # ───────── 硬护栏 3：后端 pytest（PostgreSQL 真实库）─────────
  # 针对 PostgreSQL 跑，确保 issue #4 这类「仅 PostgreSQL 强制 VARCHAR 长度」
  # 才会暴露的缺陷被回归测试守住（SQLite 不强制长度，单跑会漏）。
  backend-tests:
    name: 后端 · pytest（PostgreSQL · 硬护栏）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: cmc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d cmc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/cmc_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 安装依赖（运行 + 测试）
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: pytest
        working-directory: backend
        run: python -m pytest tests/ -v --cov=app.services.accounts --cov=app.schemas.accounts --cov=app.api.v1.accounts --cov=app.api.v1.portal --cov-branch --cov-fail-under=90 --cov-report=term-missing --cov-report=json:coverage.json

  # ───────── 硬护栏 4：Docker 镜像可构建 ─────────
  docker:
    name: Docker · 镜像构建验证（硬护栏）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 构建单镜像（SPA + API），仅验证可构建不推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────── 软护栏：lint 报告（不阻断合并）─────────
  lint:
    name: Lint 报告（软护栏 · 不阻断）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: eslint（存量问题仅报告）
        run: npm run lint
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install ruff==0.7.0
      - name: ruff check（存量问题仅报告）
        run: ruff check backend/app
        continue-on-error: true
