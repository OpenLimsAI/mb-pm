xperimental observations and technical decisions. A shared framework helps teams organize the evidence and maintain continuity across different development stages.</p><p>Connecting <span class="highlight">process understanding and product quality</span> supports structured discussion and makes the basis of each decision easier to trace.</p><h3>2. A structured research workflow</h3><p>Define the research question, review available evidence, and document the remaining uncertainty. Each study should connect its objectives with clear observations and reviewable conclusions.</p><div class="notice" style="margin-top:22px;font-size:10px">此处为排版演示文本，不构成论文原文或研究结论。</div></article></section>${state.hideAssistant?'':`<aside class="research-panel"><div class="research-header"><h3>${i('sparkles')}研究助手</h3><button class="icon-btn" data-action="toggle-assistant" aria-label="隐藏研究助手">${i('close')}</button></div><div class="research-body"><div><div class="scope-label">问答范围</div><div class="scope-options">${['当前论文','文献集合','整个知识库'].map(s=>`<button class="btn ${state.scope===s?'selected':''}" data-scope="${s}">${s}</button>`).join('')}</div></div><div class="ai-question">帮我梳理这篇论文的研究思路。</div><div class="ai-answer"><h4>${i('sparkles')}从研究问题到证据</h4><p>可以沿着三个层次阅读这篇资料：</p><ol><li><strong>研究目标</strong>：明确工艺研究要回答的问题。</li><li><strong>验证路径</strong>：关联实验设计与质量指标。</li><li><strong>证据记录</strong>：保留结果、依据与尚待验证的事项。<span class="citation">1</span></li></ol><div class="evidence"><div class="row">${i('file')}依据 · 当前示例论文</div>Introduction / A structured research workflow</div></div></div><div class="composer"><textarea id="kb-question" placeholder="围绕这篇资料继续提问…" aria-label="研究助手提问"></textarea><div class="composer-footer"><span>DeepSeek · 研究模型</span><button class="send" data-action="kb-send" aria-label="发送研究问题">${i('arrowup')}</button></div></div><div class="research-foot">AI 回答为设计示例 · 请以原始证据为准</div></aside>`}</div>`}

function reports(){return `${heading('RESEARCH REPORTS','抗体纯化工艺比较研究','我的研究报告 / 草稿',badge('已保存','gray')+btn('导出','download','data-toast="报告导出沿用统一的文件格式选择界面。"')+btn('保存报告','check','data-toast="设计稿中的内容已保留在当前页面；未写入业务系统。"',true))}<div class="writing-grid"><aside class="outline"><h3>报告目录</h3>${['研究背景','比较维度','证据与分析','待验证问题','结论与建议'].map((t,n)=>`<button class="${n===0?'active':''}" data-outline="${n}">${String(n+1).padStart(2,'0')}　${t}</button>`).join('')}<div class="divider"></div><p class="small muted" style="font-size:10px;padding:10px">共 5 个章节<br>参考资料 3 篇</p></aside><section class="editor-page"><div class="editor-tools"><span>正文</span><span style="color:#c2cbd3">│</span><button class="icon-btn" data-toast="加粗文本样式示例" aria-label="加粗"><b>B</b></button><button class="icon-btn" data-toast="斜体文本样式示例" aria-label="斜体"><i>I</i></button><button class="icon-btn" data-toast="插入引用" aria-label="插入引用">${i('link')}</button><span style="margin-left:auto;font-size:10px">${i('clock')} 今天 09:42</span></div><div class="editor-content" contenteditable="true" role="textbox" aria-label="研究报告正文" aria-multiline="true"><div class="eyebrow">RESEARCH DRAFT / 研究草稿</div><h1>抗体纯化工艺比较研究</h1><p>研发中心 · 工艺研究组　|　2026.11</p><h2 id="report-section-0">01　研究背景</h2><p>本报告整理现有研究资料，为团队讨论纯化工艺的后续研究方向提供统一的依据。重点关注工艺步骤、分析维度与待补充的验证工作。</p><div class="quote">研究的价值，不止是得到结论，更在于让结论背后的依据可以被复核。</div><h2 id="report-section-1">02　比较维度</h2><p>建议将资料归入一致的比较框架，减少不同材料之间的口径差异。</p><ul><li>工艺目标与适用阶段</li><li>质量指标与分析方法</li><li>实验设计与验证条件</li></ul><h2 id="report-section-2">03　证据与分析</h2><p>按每项观察关联原始资料与研究笔记，区分已证实信息和待验证假设。<span class="citation">1</span></p><h2 id="report-section-3">04　待验证问题</h2><p>记录需要补充实验或进一步检索的事项，并明确下一步负责人。</p><h2 id="report-section-4">05　结论与建议</h2><p>后续结论需结合实际实验数据，由团队讨论和确认。</p></div><div class="editor-footer"><span>草稿 · 可直接编辑体验</span><span>示例正文</span></div></section><aside class="research-panel"><div class="research-header"><h3>${i('sparkles')}写作助手</h3></div><div class="research-body"><div class="tabs"><button class="tab active">参考资料</button><button class="tab" data-toast="写作讨论保留在当前报告上下文。">讨论</button></div><div class="ai-answer"><h4>让每一段分析有据可查</h4><p>选择知识资料，组织证据与引用。</p></div>${papers.slice(0,3).map((p,n)=>`<button class="paper-card" data-go="kb"><h3>${n+1}. ${p.short}</h3><div class="paper-meta">${p.journal}</div><span class="tag">查看原文 ${i('arrow')}</span></button>`).join('')}${btn('添加参考资料','plus','data-toast="可从知识库选择已有论文作为报告依据。"')}</div><div class="composer"><textarea aria-label="给写作助手的要求" placeholder="优化这段论述，或补充研究思路…"></textarea><div class="composer-footer"><span>DeepSeek</span><button class="send" data-toast="这里展示写作助手的交互样式，未调用模型。" aria-label="发送写作要求">${i('arrowup')}</button></div></div></aside></div>`}

function sources(){return `${heading('KNOWLEDGE SOURCES','连接可靠的信息来源','按来源收录资料，让团队知识库持续更新。',btn('添加来源','plus','data-toast="添加来源时配置名称、来源地址和目标文件夹。"',true))}<div class="toolbar"><div class="tabs"><button class="tab active">信息源</button><button class="tab" data-go="kb">已归档资料</button><button class="tab" data-toast="运行记录展示检查、下载和归档的每个结果。">运行记录</button></div><span class="small muted">1 个示例来源 · 4 个监控范围</span></div><section class="source-card"><div class="row between"><div class="row" style="gap:16px"><span class="source-avatar">ICH</span><div><h2>ICH 官方指导原则</h2><p class="small muted" style="margin-top:6px">www.ich.org</p></div></div>${badge(state.sourcePaused?'已暂停监控':'监控已开启',state.sourcePaused?'gray':'green')}</div><div class="source-summary"><div><span>目标文件夹</span>ICH 指导原则</div><div><span>检查频率</span>每日一次</div><div><span>首次收录</span>可独立执行</div></div><div class="scopes">${[['Q','质量'],['S','安全性'],['E','有效性'],['M','多学科']].map(([k,t],n)=>`<div class="scope-card"><h3><input type="checkbox" checked aria-label="监控${t}">${k} ${t}</h3>${badge(n===3?'等待下次检查':'检查完成',n===3?'gray':'green')}<p>最近检查：今天 08:00</p><button class="link" data-toast="正式应用可打开 ${k} 类官方栏目；此处为设计预览。">官方栏目 ↗</button></div>`).join('')}</div><div class="source-footer">${btn(state.sourcePaused?'恢复监控':'暂停监控','clock','data-action="toggle-source"')}${btn('批量收录到知识库','download','data-toast="批量收录将先预览资料清单，再确认下载与归档。"',true)}${btn('查看运行记录','chart','data-toast="运行记录可查看每次检查结果、失败原因和重试入口。"')}<span class="small muted" style="margin-left:auto;font-size:10px">所有运行状态均为演示</span></div></section><div class="panel"><div class="panel-head"><h2>最近归档资料</h2>${btn('查看全部','arrow','data-go="kb"')}</div>${table(['资料名称','来源范围','归档位置','状态','更新时间'],[['<strong>质量研究指导原则 · 示例资料 A</strong>','Q 质量','ICH 指导原则',badge('已归档','blue'),'11/11 08:12'],['<strong>临床研究指导原则 · 示例资料 B</strong>','E 有效性','ICH 指导原则',badge('已归档','blue'),'11/10 08:09']])}</div>`}
function guide(){return `${heading('MAIBO / BLUE EDITION 01','冷静的蓝，清晰的工作。','用同一套色彩与组件，连接整个迈博智能化系统。',btn('查看工作台','grid','data-go="home"',true))}<div class="swatches">${[['#1E466B','Bold Blue','深蓝 · 主色','主导航、主要操作、AI 面板标题','#fff'],['#67BAF4','Light Blue','浅蓝 · 强调色','选中状态、进度图表、重点标记','#143b59'],['#FAFAFA','Soft White','柔白 · 基底','阅读面板、表单、主要内容区','#1e466b'],['#0D0D0D','Jet Black','近黑 · 文字','页面标题与高优先级信息','#fff']].map(([c,n,t,d,tx])=>`<article class="swatch"><div class="swatch-color" style="background:${c};color:${tx}"><span>${n}</span><small>${c}</small></div><div class="swatch-copy"><h3>${t}</h3><p>${d}</p></div></article>`).join('')}</div><div class="grid-2"><section class="panel"><div class="panel-head"><h2>操作层级</h2><span class="small muted">清楚区分主次</span></div><div class="panel-body"><div class="sample-buttons">${btn('主要操作','plus','data-toast="深蓝主按钮用于一个区域内最主要的操作。"',true)}${btn('次要操作','download','data-toast="次要按钮使用白底与浅灰描边。"')}<button class="btn subtle" data-toast="浅蓝底用于轻量操作和选择状态。">${i('sparkles')}辅助操作</button></div><label class="field"><span>输入框与选择</span><input class="input" placeholder="点击体验焦点状态" aria-label="设计规范输入框"></label><div class="divider"></div><div class="row" style="gap:12px;flex-wrap:wrap">${badge('进行中','blue')}${badge('已完成','green')}${badge('待关注','amber')}${badge('未开始','gray')}</div><p class="small muted" style="margin-top:12px">业务状态保留各自语义，不用同一种蓝色表达所有结果。</p></div></section><section class="panel"><div class="panel-head"><h2>信息层级</h2><span class="small muted">适合长时间阅读</span></div><div class="panel-body"><div class="eyebrow">RESEARCH WORKSPACE</div><h1 style="font-size:26px;margin:13px 0">研究与协作的统一空间</h1><p style="font-size:13px;color:var(--muted)">正文保持易读的对比度；标题、说明、数据和操作各有位置。白色面板承载内容，浅灰蓝底区分工作区域。</p><div class="divider"></div><div class="row between"><div><h3>任务完成度</h3><p class="small muted" style="margin-top:7px">用浅蓝色表达进度</p></div><strong style="font-size:26px;color:var(--blue)">72%</strong></div><div class="progress" style="margin-top:14px"><span style="width:72%"></span></div></div></section></div><div class="principle-list" style="margin-top:24px"><article class="principle"><div class="num">01 / CONSISTENCY</div><h3>统一的外壳</h3><p>所有应用使用相同的品牌区、回音壁、工作台、账号入口与导航规则。</p></article><article class="principle"><div class="num">02 / FOCUS</div><h3>克制的色彩</h3><p>大面积留给内容，深蓝用于行动，浅蓝用于强调，保证阅读与密集表格的清晰度。</p></article><article class="principle"><div class="num">03 / CONTEXT</div><h3>适合工作的布局</h3><p>项目用表格与甘特图，研究用阅读与问答，报告用写作与引用，不强行统一内容结构。</p></article></div><div class="notice" style="margin-top:20px">颜色按参考图中标注的 HEX 值还原。Light Blue 配深色文字，避免浅蓝底配白字造成可读性不足。</div>`}

document.addEventListener('click',e=>{const go=e.target.closest('[data-go]');if(go){navigate(go.dataset.go);return}const el=e.target.closest('button');if(!el)return;if(el.dataset.toast){toast(el.dataset.toast);return}if(el.hasAttribute('data-pm-view')){state.pmView=el.dataset.pmView;render();return}if(el.hasAttribute('data-paper')){state.paper=Number(el.dataset.paper);render();return}if(el.dataset.reader){state.reader=el.dataset.reader;render();return}if(el.dataset.scope){state.scope=el.dataset.scope;render();toast(`问答范围已切换为${state.scope}`);return}if(el.dataset.prompt){state.assistantPrompt=el.dataset.prompt;state.assistantAnswer='';render();document.querySelector('#assistant-prompt').focus();return}if(el.hasAttribute('data-note')){state.note=Number(el.dataset.note);render();return}if(el.hasAttribute('data-outline')){document.querySelectorAll('[data-outline]').forEach(x=>x.classList.toggle('active',x===el));document.querySelector('#report-section-'+el.dataset.outline)?.scrollIntoView({block:'center',behavior:'smooth'});return}switch(el.dataset.action){case'menu':document.querySelector('#sidebar').classList.toggle('mobile-open');break;case'toggle-assistant':state.hideAssistant=!state.hideAssistant;render();break;case'kb-send':{const q=document.querySelector('#kb-question');if(q?.value.trim()){toast('这是研究助手的设计演示，未发起真实 AI 请求。');q.value=''}else toast('先输入想要研究的问题。');break}case'new-conversation':state.assistantPrompt='';state.assistantAnswer='';render();break;case'new-note':toast('新建笔记将打开空白编辑器。当前展示已有笔记的编辑样式。');break;case'toggle-source':state.sourcePaused=!state.sourcePaused;render();break;}});
document.addEventListener('input',e=>{if(e.target.id==='paper-search'){state.kbSearch=e.target.value;document.querySelector('#paper-cards').innerHTML=paperCards()}if(e.target.id==='task-search'){const q=e.target.value.toLowerCase();document.querySelectorAll('.data-table tbody tr').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(q))}if(e.target.id==='gantt-zoom'){const v=Number(e.target.value);document.querySelector('#gantt-grid').style.minWidth=`${800+v*12}px`;document.querySelector('#zoom-label').textContent=v<20?'年':v<50?'月':v<80?'周':'日'}});

}
