<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">账号列表分开显示平台身份与应用权限的原型</title><desc id="desc">虚构的六个账号分别展示平台身份、项目管理和知识库权限。系统管理员单独列在平台身份，项目管理全部权限标注继承平台身份。知识库只开放可编辑，未分配知识库角色的账号标记待分配。</desc><defs><filter id="shadow" x="-20%" y="-10%" width="140%" height="130%"><feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#152D3D" flood-opacity=".19"/></filter></defs><g font-family="Microsoft YaHei, PingFang SC, Noto Sans SC, sans-serif"><rect x="0" y="0" width="1600" height="1000" rx="0" fill="#F4F7FA" stroke="none" /><rect x="0" y="0" width="1600" height="88" rx="0" fill="#fff" stroke="none" /><path d="M0 87H1600" stroke="#E5ECF0" stroke-width="1"/><circle cx="196" cy="44" r="18" fill="#EAF3F6" stroke="none" stroke-width="1"/><path d="M186 50V36L196 45L206 36V50" fill="none" stroke="#176B7C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /><text x="227" y="40" font-size="21" fill="#203A4A" font-weight="700" >迈博药业</text><text x="227" y="62" font-size="11" fill="#637987" font-weight="400" letter-spacing="1.4">数字化工作空间</text><text x="420" y="49" font-size="14" fill="#637987" font-weight="400" >工作台</text><text x="510" y="49" font-size="14" fill="#176B7C" font-weight="600" >账号管理</text><text x="622" y="49" font-size="14" fill="#637987" font-weight="400" >我的设置</text><text x="735" y="49" font-size="14" fill="#637987" font-weight="400" >版本更新</text><text x="848" y="49" font-size="14" fill="#637987" font-weight="400" >使用帮助</text><path d="M510 68H566" stroke="#176B7C" stroke-width="2"/><circle cx="1232" cy="44" r="17" fill="#EAF2F7" stroke="none" stroke-width="1"/><text x="1232" y="49" font-size="13" fill="#203A4A" font-weight="600" text-anchor="middle">陈</text><text x="1259" y="49" font-size="14" fill="#203A4A" font-weight="500" >陈宁</text><rect x="1320" y="25" width="104" height="34" rx="7" fill="#fff" stroke="#DBE5EB" /><text x="1372" y="48" font-size="13" fill="#20