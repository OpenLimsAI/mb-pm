<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CMC-PMS Demo</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --surface-2: #eef3f7;
      --line: #d9e1ea;
      --text: #1d2630;
      --muted: #637083;
      --teal: #147d7e;
      --teal-soft: #d9f0ef;
      --blue: #2f6fc9;
      --blue-soft: #e5eefc;
      --green: #2d8a55;
      --green-soft: #e0f3e8;
      --amber: #b47713;
      --amber-soft: #fff0cf;
      --red: #c9443c;
      --red-soft: #fde4e0;
      --violet: #6750a4;
      --violet-soft: #ece7ff;
      --coral: #c85d3e;
      --shadow: 0 12px 30px rgba(38, 50, 65, 0.12);
      --radius: 8px;
      --sidebar: 248px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      font-size: 14px;
      letter-spacing: 0;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    .app {
      display: grid;
      grid-template-columns: var(--sidebar) minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 18px 14px;
      background: #20313b;
      color: #eef7f7;
      overflow-y: auto;
    }

    .brand {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 10px;
      align-items: center;
      padding: 8px 8px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.14);
      margin-bottom: 12px;
    }

    .brand-mark {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      background: #f4c95d;
      color: #20313b;
      border-radius: 8px;
      font-weight: 800;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.25;
    }

    .brand-subtitle {
      color: #b9c9cf;
      font-size: 12px;
      margin-top: 3px;
    }

    .nav-group-title {
      padding: 14px 10px 7px;
      color: #9fb2bb;
      font-size: 12px;
    }

    .nav-button {
      display: grid;
      grid-template-columns: 28px 1fr auto;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 40px;
      margin: 3px 0;
      padding: 8px 10px;
      border-radius: 8px;
      color: #dce8ea;
      background: transparent;
      text-align: left;
    }

    .nav-button:hover,
    .nav-button.active {
      background: #2f4652;
      color: #ffffff;
    }

    .nav-icon {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      border-radius: 7px;
      background: rgba(255,255,255,0.08);
      font-size: 12px;
      font-weight: 700;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      padding: 0 7px;
      border-radius: 999px;
      color: #ffffff;
      background: var(--coral);
      font-size: 12px;
      font-weight: 700;
    }

    .main {
      min-width: 0;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      display: grid;
      grid-template-columns: minmax(260px, 1fr) auto auto auto;
      gap: 12px;
      align-items: center;
      min-height: 68px;
      padding: 14px 22px;
      background: rgba(245,247,251,0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(12px);
    }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      height: 40px;
      padding: 0 14px 0 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--text);
    }

    .search::before {
      content: "Q";
      position: absolute;
      left: 13px;
      top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .top-action,
    .primary,
    .secondary,
    .ghost,
    .danger {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 8px 12px;
      border-radius: 8px;
      white-space: nowrap;
      font-weight: 650;
    }

    .top-action {
      border: 1px solid var(--line);
      background: var(--surface);
      color: var(--text);
    }

    .primary {
      background: var(--teal);
      color: #ffffff;
    }

    .secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .ghost {
      color: var(--teal);
      background: transparent;
    }

    .danger {
      background: var(--red-soft);
      color: var(--red);
    }

    .content {
      padding: 22px;
      min-width: 0;
    }

    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .page-title {
      margin: 0;
      font-size: 24px;
      line-height: 1.2;
    }

    .page-meta {
      margin-top: 7px;
      color: var(--muted);
      line-height: 1.6;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
    }

    .grid {
      display: grid;
      gap: 14px;
    }

    .grid.kpi {
      grid-template-columns: repeat(4, minmax(180px, 1fr));
    }

    .grid.two {
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.65fr);
    }

    .grid.three {
      grid-template-columns: repeat(3, minmax(0, 1fr));
    }

    .panel {
      min-width: 0;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(38, 50, 65, 0.03);
    }

    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 800;
    }

    .panel-note {
      color: var(--muted);
      font-size: 12px;
    }

    .metric {
      min-height: 116px;
      display: grid;
      align-content: space-between;
      gap: 12px;
    }

    .metric-value {
      font-size: 29px;
      font-weight: 800;
      line-height: 1.1;
    }

    .metric-label {
      color: var(--muted);
      font-size: 13px;
    }

    .metric-trend {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
    }

    .chip,
    .status,
    .mini-chip {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      font-weight: 700;
      white-space: nowrap;
    }

    .chip {
      min-height: 28px;
      padding: 5px 10px;
      background: var(--surface-2);
      color: var(--text);
      font-size: 12px;
    }

    .mini-chip {
      min-height: 22px;
      padding: 3px 7px;
      background: var(--surface-2);
      color: var(--muted);
      font-size: 11px;
    }

    .status {
      min-height: 24px;
      padding: 4px 9px;
      font-size: 12px;
    }

    .green { background: var(--green-soft); color: var(--green); }
    .yellow { background: var(--amber-soft); color: var(--amber); }
    .red { background: var(--red-soft); color: var(--red); }
    .blue { background: var(--blue-soft); color: var(--blue); }
    .teal { background: var(--teal-soft); color: var(--teal); }
    .violet { background: var(--violet-soft); color: var(--violet); }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px 9px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: middle;
    }

    th {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      background: #f8fafc;
    }

    td {
      line-height: 1.45;
    }

    .table-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .link-button {
      color: var(--teal);
      background: transparent;
      font-weight: 750;
      padding: 4px 0;
    }

    .tabs,
    .segmented {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tab,
    .seg {
      min-height: 34px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 700;
    }

    .tab.active,
    .seg.active {
      color: #ffffff;
      background: var(--teal);
      border-color: var(--teal);
    }

    .health-matrix {
      display: grid;
      grid-template-columns: 150px repeat(6, minmax(72px, 1fr));
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .matrix-cell,
    .matrix-head {
      min-height: 44px;
      display: flex;
      align-items: center;
      padding: 8px 10px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    .matrix-head {
      color: var(--muted);
      background: #f8fafc;
      font-size: 12px;
      font-weight: 800;
    }

    .matrix-cell:nth-child(7n),
    .matrix-head:nth-child(7n) {
      border-right: 0;
    }

    .dot {
      display: inline-block;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      margin-right: 7px;
    }

    .dot.green { background: var(--green); }
    .dot.yellow { background: var(--amber); }
    .dot.red { background: var(--red); }
    .dot.gray { background: #a7b1be; }

    .timeline {
      display: grid;
      gap: 10px;
    }

    .timeline-row {
      display: grid;
      grid-template-columns: 104px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
    }

    .track {
      position: relative;
      height: 28px;
      border-radius: 999px;
      background: #eef3f7;
      overflow: hidden;
    }

    .bar {
      position: absolute;
      top: 5px;
      height: 18px;
      border-radius: 999px;
      background: var(--teal);
    }

    .bar.critical {
      background: var(--red);
    }

    .bar.bluebar {
      background: var(--blue);
    }

    .bar.greenbar {
      background: var(--green);
    }

    .bar.amberbar {
      background: var(--amber);
    }

    .kanban {
      display: grid;
      grid-template-columns: repeat(4, minmax(190px, 1fr));
      gap: 12px;
    }

    .kanban-col {
      min-height: 420px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #f8fafc;
    }

    .kanban-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-weight: 800;
    }

    .task-card {
      display: grid;
      gap: 8px;
      padding: 11px;
      margin-bottom: 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .task-title {
      font-weight: 800;
      line-height: 1.4;
    }

    .task-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .task-actions {
      display: flex;
      gap: 8px;
      justify-content: space-between;
    }

    .calendar {
      overflow: auto;
    }

    .calendar-grid {
      min-width: 860px;
      display: grid;
      grid-template-columns: 128px repeat(14, 78px);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .cal-cell {
      min-height: 50px;
      padding: 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      font-size: 12px;
    }

    .cal-head {
      background: #f8fafc;
      color: var(--muted);
      font-weight: 800;
    }

    .booking {
      min-height: 28px;
      padding: 6px;
      border-radius: 7px;
      color: #ffffff;
      line-height: 1.25;
      overflow: hidden;
    }

    .booking.teal-bg { background: var(--teal); }
    .booking.blue-bg { background: var(--blue); }
    .booking.red-bg { background: var(--red); }
    .booking.amber-bg { background: var(--amber); color: #231700; }
    .booking.green-bg { background: var(--green); }

    .heatmap {
      overflow: auto;
    }

    .heat-grid {
      min-width: 760px;
      display: grid;
      grid-template-columns: 130px repeat(8, 1fr);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .heat-cell {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 7px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: var(--surface);
      font-size: 12px;
      font-weight: 700;
    }

    .heat-name {
      justify-content: flex-start;
      color: var(--text);
      background: #f8fafc;
    }

    .load-low { background: #dff3e8; color: #256d45; }
    .load-mid { background: #fff1cb; color: #8a5d0d; }
    .load-high { background: #fde1dc; color: #ad342d; }

    .editor-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.9fr) minmax(360px, 1.1fr);
      gap: 14px;
    }

    .tree {
      display: grid;
      gap: 8px;
    }

    .tree-node {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 8px;
      align-items: center;
      padding: 9px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .tree-node.level-2 {
      margin-left: 18px;
      background: #f8fafc;
    }

    .tree-node.level-3 {
      margin-left: 36px;
    }

    .tree-node.selected {
      border-color: var(--teal);
      box-shadow: inset 0 0 0 1px var(--teal);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .field {
      display: grid;
      gap: 6px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 8px 10px;
      color: var(--text);
      background: var(--surface);
    }

    textarea {
      min-height: 96px;
      resize: vertical;
    }

    .wizard-steps {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .wizard-step {
      min-height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
      background: #f8fafc;
      font-weight: 800;
      text-align: center;
      padding: 8px;
    }

    .wizard-step.active {
      color: #ffffff;
      background: var(--teal);
      border-color: var(--teal);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      place-items: center;
      padding: 22px;
      background: rgba(18, 29, 35, 0.48);
    }

    .modal-backdrop.open {
      display: grid;
    }

    .modal {
      width: min(980px, 100%);
      max-height: calc(100vh - 44px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      background: var(--surface);
      border-radius: 8px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .modal.small {
      width: min(620px, 100%);
    }

    .modal-head,
    .modal-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal-foot {
      border-top: 1px solid var(--line);
      border-bottom: 0;
      justify-content: flex-end;
    }

    .modal-title {
      font-weight: 850;
      font-size: 18px;
    }

    .modal-body {
      padding: 16px;
      overflow: auto;
    }

    .notice {
      display: none;
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 40;
      width: min(420px, calc(100vw - 44px));
      padding: 13px 14px;
      border-radius: 8px;
      color: #ffffff;
      background: #20313b;
      box-shadow: var(--shadow);
      font-weight: 700;
    }

    .notice.show {
      display: block;
    }

    .roadmap {
      display: grid;
      gap: 12px;
    }

    .phase-row {
      display: grid;
      grid-template-columns: 84px minmax(170px, 0.9fr) minmax(0, 1.6fr) 96px;
      gap: 10px;
      align-items: stretch;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .phase-id {
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: var(--teal-soft);
      color: var(--teal);
      font-size: 20px;
      font-weight: 850;
    }

    .phase-title {
      font-weight: 850;
      margin-bottom: 6px;
    }

    .phase-list {
      margin: 0;
      padding-left: 18px;
      line-height: 1.7;
      color: var(--muted);
    }

    .progress-line {
      height: 9px;
      background: #e8edf3;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-line span {
      display: block;
      height: 100%;
      background: var(--teal);
    }

    .empty {
      padding: 24px;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 8px;
      background: #fbfcfe;
    }

    @media (max-width: 1100px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: static;
        height: auto;
      }

      .nav-grid-mobile {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 4px;
      }

      .topbar {
        grid-template-columns: 1fr;
      }

      .grid.kpi,
      .grid.two,
      .grid.three,
      .editor-layout,
      .kanban {
        grid-template-columns: 1fr;
      }

      .page-head,
      .panel-head {
        display: grid;
      }

      .health-matrix {
        overflow-x: auto;
      }
    }

    @media (max-width: 720px) {
      .content {
        padding: 14px;
      }

      .form-grid,
      .wizard-steps,
      .phase-row {
        grid-template-columns: 1fr;
      }

      .table-wrap {
        overflow-x: auto;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CMC</div>
        <div>
          <div class="brand-title">CMC-PMS</div>
          <div class="brand-subtitle">项目管理系统 Demo</div>
        </div>
      </div>
      <div class="nav-grid-mobile" id="nav"></div>
    </aside>

    <section class="main">
      <header class="topbar">
        <div class="search">
          <input id="globalSearch" type="search" placeholder="搜索项目、任务、模板、人员">
        </div>
        <button class="top-action" onclick="openCreateProject()">+ 创建项目</button>
        <button class="top-action" onclick="go('alerts')">通知 <span class="badge" id="alertBadge">5</span></button>
        <button class="top-action" onclick="go('admin')">CMC负责人</button>
      </header>
      <main class="content" id="content"></main>
    </section>
  </div>

  <div class="modal-backdrop" id="modalBackdrop">
    <div class="modal" id="modal">
      <div class="modal-head">
        <div class="modal-title" id="modalTitle">弹窗</div>
        <button class="secondary" onclick="closeModal()">关闭</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div class="notice" id="notice"></div>

  <script>
    const navItems = [
      { group: "项目运行", items: [
        { id: "dashboard", label: "首页看板", icon: "DB" },
        { id: "portfolio", label: "项目组合", icon: "PF" },
        { id: "project", label: "单项目", icon: "PJ" },
        { id: "gantt", label: "甘特图", icon: "GT" },
        { id: "tasks", label: "任务看板", icon: "TK" }
      ]},
      { group: "资源与协作", items: [
        { id: "resources", label: "资源日历", icon: "RC" },

    function nextTaskStatus(id) {
      const order = ["未开始", "进行中", "阻塞", "已完成"];
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      task.status = order[(order.indexOf(task.status) + 1) % order.length];
      task.progress = task.status === "已完成" ? 100 : task.status === "进行中" ? Math.max(task.progress, 30) : task.progress;
      toast(`${task.title} 已流转为：${task.status}`);
      render();
    }

    function resourceCalendar(compact) {
      const days = Array.from({ length: compact ? 7 : 14 }, (_, i) => `5/${6 + i}`);
      const resources = ["200L反应器", "AKTA Pure 2", "灌装线A", "稳定性箱"];
      return `<div class="calendar"><div class="calendar-grid" style="${compact ? "grid-template-columns:128px repeat(7,78px);min-width:650px;" : ""}">
        <div class="cal-cell cal-head">资源</div>${days.map(d => `<div class="cal-cell cal-head">${d}</div>`).join("")}
        ${resources.map((r, ri) => `
          <div class="cal-cell cal-head">${r}</div>
          ${days.map((d, di) => {
            const hit = (ri === 0 && di >= 2 && di <= 4) || (ri === 1 && di >= 7 && di <= 9) || (ri === 2 && di >= 4 && di <= 5) || (ri === 3 && di >= 1 && di <= 10);
            const conflict = ri === 0 && di === 2;
            return `<div class="cal-cell">${hit ? `<div class="booking ${conflict ? "red-bg" : ri === 1 ? "blue-bg" : ri === 2 ? "green-bg" : "amber-bg"}">${conflict ? "冲突" : ri === 0 ? "工程批" : ri === 1 ? "DSP" : ri === 2 ? "PPQ" : "稳定性"}</div>` : ""}</div>`;

    function updateTemplateNodeFromForm() {
      const node = templateNodes.find(n => n.id === selectedTemplateNode);

      node.name = document.getElementById("tplName").value;

      node.module = document.getElementById("tplModule").value;
      node.duration = Number(document.getElementById("tplDuration").value);

      const parent = templateNodes.find(n => n.id === selectedTemplateNode && n.level === 2) || templateNodes.find(n => n.level === 2);

    function deleteTemplateNode() {
      const node = templateNodes.find(n => n.id === selectedTemplateNode);
      if (!node) return;
      if (node.level === 2 && templateNodes.some(n => n.parent === node.id)) {
        toast("该子项目下存在任务，Demo中先给出约束警告");
        return;

      const index = templateNodes.findIndex(n => n.id === selectedTemplateNode);

    }

    function wizardConfirm() {
      return `<div class="grid three"><div class="panel metric" style="box-shadow:none;"><div><div class="metric-label">子项目</div><div class="metric-value">3</div></div><span class="status teal">Level 2</span></div><div class="panel metric" style="box-shadow:none;"><div><div class="metric-label">任务</div><div class="metric-value">28</div></div><span class="status blue">Level 3</span></div><div class="panel metric" style="box-shadow:none;"><div><div class="metric-label">预估工时</div><div class="metric-value">186</div></div><span class="status yellow">人天</span></div></div><div style="height:12px;"></div><div class="status yellow">确认后项目进入执行跟踪阶段，模板版本固定为 V1.2。</div>`;
    }

    function nextWizardStep() {
      if (wizardStep < 4) {
        wizardStep += 1;
        renderProjectWizard();
      } else {
        toast("项目已创建，并基于模板生成三级任务树");
        closeModal();
      }
    }

    function openModal(title, body, foot = "") {
      document.getElementById("modalTitle").textContent = title;
      document.getElementById("modalBody").innerHTML = body;
      document.getElementById("modalFoot").innerHTML = foot || `<button class="primary" onclick="closeModal()">确定</button>`;
      document.getElementById("modalBackdrop").classList.add("open");
    }

    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function toast(message) {
      const notice = document.getElementById("notice");
      notice.textContent = message;
      notice.classList.add("show");
      clearTimeout(window.noticeTimer);
      window.noticeTimer = setTimeout(() => notice.classList.remove("show"), 2400);
    }

    document.getElementById("globalSearch").addEventListener("keydown", event => {
      if (event.key === "Enter") {
        toast(`已搜索：${event.target.value || "全部"}`);
      }
    });

    document.getElementById("modalBackdrop").addEventListener("click", event => {
      if (event.target.id === "modalBackdrop") closeModal();
    });

    renderNav();
    render();
  </script>
</body>
</html>
