# 受限应急入口：仅绑定服务器回环地址，通过已认证 SSH 通道维护。
# 不再向公网暴露 8443/18443；正常用户继续通过 Cloudflare 域名访问。
# 内部 CA 证书必须验证；不得关闭 TLS 校验或指导用户忽略浏览器证书错误。
# SSH 维护示例与发布/回滚步骤见 ../security/README.md。
#
# - 与域名入口共用同一数据库和 IAM，两个入口的数据实时一致。
# - token 的签发方（issuer）仍是 https://iam.openlims.ai；应用发往签发方的浏览器跳转
#   由 direct-proxy 改写到本入口的 :18443（见 direct/Caddyfile），无需改代码。
# - IAM 应用 mp-pm 须登记本入口的回调与登出地址：python3 direct_entry.py register。
#
# 启用：docker compose -f compose.yml -f compose.production.yml -f compose.direct.yml up -d --no-deps app-direct direct-proxy
# 停用：docker compose -f compose.yml -f compose.production.yml -f compose.direct.yml rm -sf app-direct direct-proxy
#       再执行 python3 direct_entry.py unregister
# 注意：只带前两个文件执行 `up --remove-orphans` 会把这两个容器当作孤儿删除。

services:
  app-direct:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    image: mb-pm:${PMS_IMAGE_TAG:?run setup.py init first}
    restart: unless-stopped
    depends_on:
      pms-db:
        condition: service_healthy
      casdoor:
        condition: service_started
    environment:
      DATABASE_URL: postgresql+psycopg://mbpm:${PMS_DB_PASSWORD}@pms-db:5432/mb_pm
      APP_ENV: production
      APP_SECRET: ${APP_SECRET:?run setup.py init first}
      AUTO_SEED: "false"
      STATIC_DIR: /code/static
      LOG_LEVEL: INFO
      PMS_PUBLIC_URL: https://36.154.190.9:8443
      APP_CORS_ORIGINS: https://36.154.190.9:8443
      CASDOOR_ENDPOINT: https://iam.openlims.ai   # token 签发方，与域名入口一致
      CASDOOR_INTERNAL_URL: http://casdoor:8000
      CASDOOR_CLIENT_ID: ${CASDOOR_CLIENT_ID}
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:?run setup.py init first}
      CASDOOR_ORG: mabpharm
      IAM_COOKIE_SECURE: "true"
      AI_SETTINGS_PATH: /data/ai/ai-settings.json
      ASSISTANT_WEB_ENABLED: ${ASSISTANT_WEB_ENABLED:-false}
      ASSISTANT_WEB_PROVIDER: ${ASSISTANT_WEB_PROVIDER:-deepseek}
      ASSISTANT_WEB_API_KEY: ${ASSISTANT_WEB_API_KEY:-}
      ASSISTANT_WEB_MAX_RESULTS: ${ASSISTANT_WEB_MAX_RESULTS:-5}
    # OAuth 回调 URL 含短期凭据，不写访问日志
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    volumes:
      - ai_settings:/data/ai
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [internal]

  direct-proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app-direct:
        condition: service_healthy
      casdoor:
        condition: service_started
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:18443:18443"
    volumes:
      - ./direct/Caddyfile:/etc/caddy/Caddyfile:ro
      - direct_caddy_data:/data   # 内置 CA 与证书持久化，重启后证书不变
    networks: [internal]

volumes:
  direct_caddy_data:
