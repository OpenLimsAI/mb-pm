# www 门户发布前先配置独立 IAM 应用；日常发版保留客户现有业务数据。
services:
  app:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    environment:
      PMS_PUBLIC_URL: https://pm.openlims.ai
      APP_CORS_ORIGINS: https://pm.openlims.ai,https://www.openlims.ai
      PORTAL_PUBLIC_URL: ${PORTAL_PUBLIC_URL:-https://www.openlims.ai}
      CASDOOR_ENDPOINT: https://iam.openlims.ai
      IAM_COOKIE_SECURE: "true"
    # OAuth callback URLs contain short-lived credentials; do not write request URLs.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]
    # 共享入口网络：Tunnel 经 edge 访问各栈的门面服务，其他栈不再接入 internal。
    networks: [internal, edge]

  casdoor:
    networks: [internal, edge]

  tunnel:
    # 2026.10.3 修复受影响的 eMudhra 证书信任；固定摘要，更新后须重建容器。
    image: cloudflare/cloudflared:2026.10.3@sha256:faa8e0a1475f137c910be6025f43c8e4092fdd35461b31e19fd1390657a1ff39
    restart: unless-stopped
    user: "1000:1000"
    # 只走 TCP（HTTP/2，端口 7844）：服务器在国内，到 Cloudflare 的 UDP（QUIC）在晚高峰会被整段阻断，
    # 默认 auto 每次断线都先空等 QUIC 超时再回落，拉长中断时间（2026-10-13 事故）。
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run", "--token-file", "/run/tunnel-token"]
    volumes:
      - ./tunnel-token:/run/tunnel-token:ro
    # 过渡期同时接 internal；各栈门面都迁到 edge 后可只保留 edge。
    networks: [internal, edge]
    depends_on:
      app:
        condition: service_healthy
      casdoor:
        condition: service_started

networks:
  # 主机级共享网络，不归任何栈所有：首次部署前 `docker network create edge`。
  # 只放各栈的门面服务（app、casdoor、知识库 dikw-caddy 等），数据库不接入。
  edge:
    external: true
    name: edge
