# Apply after configuring the two hostnames and refreshing the live data snapshot.
services:
  app:
    environment:
      PMS_PUBLIC_URL: https://pm.openlims.ai
      APP_CORS_ORIGINS: https://pm.openlims.ai
      CASDOOR_ENDPOINT: https://iam.openlims.ai
      IAM_COOKIE_SECURE: "true"
    # OAuth callback URLs contain short-lived credentials; do not write request URLs.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log"]

  tunnel:
    image: cloudflare/cloudflared@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    restart: unless-stopped
    user: "1000:1000"
    command: ["tunnel", "--no-autoupdate", "run", "--token-file", "/run/tunnel-token"]
    volumes:
      - ./tunnel-token:/run/tunnel-token:ro
    networks: [internal]
    depends_on:
      app:
        condition: service_healthy
      casdoor:
        condition: service_started
