# Append LAST to the exact active Compose file set. Do not omit private overlays.
x-app-hardening: &app-hardening
  user: "10001:10001"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=128m,mode=1777
  mem_limit: 1536m
  memswap_limit: 1536m
  cpus: 2
  pids_limit: 128
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"
services:
  app:
    <<: *app-hardening
    image: ${SECURITY_PM_IMAGE:?fixed candidate required}
    environment:
      DATABASE_URL: ${PMS_RUNTIME_DATABASE_URL:?least-privilege database URL required}
      AUTO_MIGRATE_SCHEMA: "false"
      AUTO_SEED: "false"
      AI_ALLOWED_INTERNAL_ORIGINS: "http://127.0.0.1:11434"
  app-direct:
    <<: *app-hardening
    image: ${SECURITY_PM_IMAGE:?fixed candidate required}
    environment:
      DATABASE_URL: ${PMS_RUNTIME_DATABASE_URL:?least-privilege database URL required}
      AUTO_MIGRATE_SCHEMA: "false"
      AUTO_SEED: "false"
      AI_ALLOWED_INTERNAL_ORIGINS: "http://127.0.0.1:11434"
  direct-proxy:
    image: caddy@sha256:86deaf5e3d3408a6ccec08fbb79989783dd26e206ae10bcf78a801dc8c9ab794
    ports: !override
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:18443:18443"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
