services:
  postgres:
    image: postgres:16-alpine
    container_name: cmc-pms-pg
    environment:
      POSTGRES_USER: cmc
      POSTGRES_PASSWORD: cmc
      POSTGRES_DB: cmc_pms
    # 不对宿主机暴露端口：仅供 backend 经 compose 网络 (postgres:5432) 访问。
    # （宿主机 5432 已被 mb-casd 的 Casdoor Postgres 占用，且对外暴露 DB 也不安全。）
    expose:
      - "5432"
    volumes:
      - cmc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmc -d cmc_pms"]
      interval: 5s
      retries: 5

  backend:
    build: .
    container_name: cmc-pms-api
    environment:
      DATABASE_URL: postgresql+psycopg://cmc:cmc@postgres:5432/cmc_pms
      APP_ENV: development
      # 兼作 IAM 会话加密密钥（≥32 字符随机值），与 client secret 一起写在 backend/.env 或 shell 环境中
      APP_SECRET: ${APP_SECRET:?请设置 APP_SECRET（≥32 字符随机值）}
      # 前端 Vite 跑在 5175，并把 /api 代理到本容器（前端 .env.local：API_PROXY_TARGET=http://localhost:8080）
      APP_CORS_ORIGINS: http://localhost:5175
      PMS_PUBLIC_URL: http://localhost:5175
      # Casdoor：浏览器与 token issuer 用 localhost:8000；容器内换 token / 拉 JWKS 走 host.docker.internal
      CASDOOR_ENDPOINT: http://localhost:8000
      CASDOOR_INTERNAL_URL: http://host.docker.internal:8000
      CASDOOR_CLIENT_ID: mppm-client-id-0001
      CASDOOR_CLIENT_SECRET: ${CASDOOR_CLIENT_SECRET:?请设置 Casdoor 应用 mp-pm 的 client secret}
      CASDOOR_ORG: mabpharm
      AI_SETTINGS_PATH: /data/ai/ai-settings.json
      INFORMATION_DATA_DIR: /data/information
    extra_hosts:
      # Linux 下让 host.docker.internal 解析到宿主机网关（Docker Desktop/Mac 默认已支持）。
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    # 宿主机 8080 → 容器 8000（8000 已被 Casdoor 占用），与前端 VITE_API_URL 一致。
    ports:
      - "8080:8000"
    volumes:
      - ./app:/code/app
      - ./alembic:/code/alembic
      - ./alembic.ini:/code/alembic.ini
      - ai_settings:/data/ai
      - information_originals:/data/information
    # 建表用 SQLAlchemy create_all（从 ORM 模型生成全部表），不依赖 alembic 迁移
    # —— 现有迁移与模型有漂移（缺 project_finances 等表），本地开发以模型为准。
    command: >
      sh -c "python -c 'import app.models; from app.db.base import Base; from app.db.session import engine; Base.metadata.create_all(bind=engine)' &&
             python -m app.seed.seed_data &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  cmc_pgdata:
  ai_settings:
  information_originals:
